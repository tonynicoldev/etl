services:
  db:  # Docker hub-based managed latest mongodb image
    image: mongo
    container_name: mongo
    restart: unless-stopped
    env_file:
      - .env              
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      start_period: 20s # At least give it a chance
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
    - ${MONGO_CONTAINER_PORT}:${MONGO_PORT}
    
    volumes:
      - db:/data/db

volumes:
  db:
    name: db